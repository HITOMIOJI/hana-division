<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ec4899"><title>HANAの割り算つよつよ計画♡</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#263244;background:linear-gradient(135deg,#fff1f7,#fff,#f5f0ff);min-width:320px}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border:2px solid #fbcfe8;border-radius:26px;padding:20px}.badge{display:inline-block;background:#172033;color:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900}.pink{color:#ec4899}h1{font-size:34px;line-height:1.06;margin:14px 0 8px}.lead{font-weight:700;color:#667085}.progressrow{display:flex;align-items:center;gap:10px;margin-top:18px}.track{height:12px;background:#f1f5f9;border-radius:20px;flex:1;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#f472b6,#a855f7)}.rule{background:#172033;color:#fff;border-radius:20px;padding:14px;margin:14px 0}.rule small{color:#dbe2ef}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}button{border:0;font:inherit;cursor:pointer}.nav button{min-height:46px;border:2px solid #fbcfe8;border-radius:13px;background:#fff;font-weight:900}.nav .on{background:#ec4899;color:#fff}.nav .review{background:#fff1f2;color:#e11d48}.nav button:disabled{opacity:.45}.stage{border:2px solid #fbcfe8;border-radius:26px;padding:16px;background:linear-gradient(135deg,#fff1f7,#faf5ff)}.stage h2{margin:0;font-size:21px}.sub{font-size:14px;color:#667085;font-weight:650;margin-top:5px}.question{background:#fff;border-radius:22px;padding:18px;margin-top:16px}.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:900}.pill{background:#f8fafc;padding:6px 10px;border-radius:999px}.tag{background:#fdf2f8;color:#db2777}.qtext{font-size:22px;line-height:1.55;font-weight:900}.answer{display:flex;gap:9px}input{width:100%;min-height:50px;border:2px solid #fbcfe8;border-radius:14px;padding:12px;font:inherit;font-size:17px;font-weight:800;background:#fff7fb}.check,.next{min-height:50px;border-radius:14px;color:#fff;font-weight:900;padding:10px 20px}.check{background:linear-gradient(90deg,#ec4899,#d946ef)}.hintbtn{margin-top:12px;background:#fffbeb;color:#a16207;border-radius:13px;padding:10px 14px;font-weight:900}.box{margin-top:12px;padding:14px;border-radius:15px;line-height:1.6}.hint{background:#fffbeb}.wrong{background:#fff1f2;border:2px solid #fecdd3}.right{background:#ecfdf5;border:2px solid #a7f3d0}.next{background:#172033;margin-top:12px}.work{background:#f0f9ff;border:2px solid #bae6fd}.work pre{background:#fff;border-radius:12px;padding:12px;overflow:auto;font-size:13px;line-height:1.55}.rules{margin-top:14px}.rulesgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rulesgrid div{border-radius:13px;padding:12px;font-size:14px;font-weight:800}.allclear{background:linear-gradient(90deg,#ec4899,#9333ea);color:#fff;text-align:center;font-weight:900;font-size:24px;margin-top:14px;border-radius:24px;padding:24px}.reset{display:block;margin:18px auto;background:none;color:#64748b;font-weight:800}@media(max-width:600px){.wrap{padding:10px}.card{padding:16px;border-radius:22px}h1{font-size:28px}.lead{font-size:14px}.stage{padding:13px;border-radius:22px}.question{padding:15px}.qtext{font-size:19px}.answer{display:block}.check{width:100%;margin-top:9px}.next{width:100%}.rulesgrid{grid-template-columns:1fr}.work pre{font-size:12px}}
</style></head><body><main class="wrap"><header class="card"><div class="badge">♛ HANA ONLY ♡</div><h1>HANAの<span class="pink">割り算</span><br>つよつよ計画♡</h1><div class="lead">カワイイだけじゃなく、ちゃんと解けるのが最強♡ 基本から塾レベルまで攻略しよ！</div><div class="progressrow"><div class="track"><div id="bar" class="bar"></div></div><b id="score"></b></div></header><section class="rule"><b>⚡ HANA'S RULE ♡</b><br><small>考える → ヒント → もう1回。間違えた問題は「🔥復習」に自動でたまるよ！</small></section><nav id="nav" class="nav"></nav><section id="app"></section><section class="card rules"><b class="pink">★ HANA'S 4 RULES ♡</b><div class="rulesgrid"><div style="background:#fdf2f8">01｜困ったら九九に戻る</div><div style="background:#faf5ff">02｜あまりは割る数より小さい</div><div style="background:#f0f9ff">03｜検算できる子は強い</div><div style="background:#fffbeb">04｜文章題は余りの意味まで考える</div></div></section><div id="clear"></div><button class="reset" onclick="resetAll()">↻ 最初からもう1周♡</button></main><script>
const STEPS=[{"title": "LEVEL 1｜HANA、まずここは余裕でいこ♡", "sub": "4年生の基本。サクッと確認して次いこ！", "qs": [{"q": "HANAが36このデコパーツを4人で同じ数ずつ分けるよ。1人何こ？", "a": "9", "hint": "36÷4。4×□=36 に変えてみて♡", "exp": "36÷4=9。4×9=36！ わり算で止まったら、かけ算に戻るのがコツ♡", "tag": "基本"}, {"q": "42このビーズを1人に6こずつ配るよ。何人に配れる？", "a": "7", "hint": "6このまとまりが42この中にいくつある？", "exp": "42÷6=7。今回は『1人分』ではなく『何人分』を求めているよ。", "tag": "意味チェック"}, {"q": "81÷9=?", "a": "9", "hint": "9×□=81！", "exp": "9×9=81だから81÷9=9。ここは秒でいこ♡", "tag": "秒速"}, {"q": "64÷8=?", "a": "8", "hint": "8×□=64！", "exp": "8×8=64だから答えは8。九九の逆向き、バッチリ！", "tag": "秒速"}]}, {"title": "LEVEL 2｜あまりまで使いこなそ♡", "sub": "答えだけじゃなく、仕組みまで分かったら強い！", "qs": [{"q": "53÷7=?（あまりも。例：7あまり4）", "a": "7あまり4", "hint": "53をこえない7の倍数で一番近いのは？", "exp": "7×7=49、53-49=4。だから7あまり4。あまりは7より小さいね♡", "tag": "あまり"}, {"q": "68÷9=?（あまりも）", "a": "7あまり5", "hint": "9×7=63。68まであといくつ？", "exp": "68-63=5だから7あまり5。9×7+5=68で検算OK！", "tag": "検算"}, {"q": "87÷8=?（あまりも）", "a": "10あまり7", "hint": "8×10=80。残りは？", "exp": "87÷8=10あまり7。あまり7は8より小さいからOK♡", "tag": "ルール"}, {"q": "□÷6=8あまり3。□はいくつ？", "a": "51", "hint": "6×8して、あまり3を足そう！", "exp": "6×8+3=51。割る数×商+あまり=元の数！", "tag": "逆算"}]}, {"title": "LEVEL 3｜筆算、キレイに攻略♡", "sub": "たてる→かける→ひく→おろす。この順番を味方にしよ！", "qs": [{"q": "92÷4=?", "a": "23", "hint": "9の中に4は2回。2×4=8、ひいて1。次に2をおろす！", "exp": "92÷4=23。順番どおり進めれば大丈夫♡", "tag": "筆算基本", "work": "      23\n   ┌────\n 4 │ 92\n     8   ← 4×2\n    ──\n     12  ← 2をおろす\n     12  ← 4×3\n    ──\n      0", "formula": "9÷4=2あまり1 → 12÷4=3 → 答え23"}, {"q": "156÷3=?", "a": "52", "hint": "15÷3=5。そのあと6÷3=2！", "exp": "156÷3=52。3×52=156で検算もできるよ♡", "tag": "3けた", "work": "      52\n   ┌─────\n 3 │ 156\n     15  ← 3×5\n     ──\n      06 ← 6をおろす\n       6 ← 3×2\n      ──\n       0", "formula": "15÷3=5 → 6÷3=2 → 答え52"}, {"q": "248÷4=?", "a": "62", "hint": "24÷4=6。そのあと8÷4=2。", "exp": "248÷4=62。大きく見えてもやることは同じ！", "tag": "安定UP", "work": "      62\n   ┌─────\n 4 │ 248\n     24  ← 4×6\n     ──\n      08 ← 8をおろす\n       8 ← 4×2\n      ──\n       0", "formula": "24÷4=6 → 8÷4=2 → 答え62"}, {"q": "325÷6=?（あまりも）", "a": "54あまり1", "hint": "32の中に6は5回。残り2に5をおろすよ。", "exp": "325÷6=54あまり1。6×54+1=325で検算できる♡", "tag": "筆算UP", "work": "      54 あまり1\n   ┌─────\n 6 │ 325\n     30  ← 6×5\n     ──\n      25 ← 5をおろす\n      24 ← 6×4\n      ──\n       1 ← あまり", "formula": "32÷6=5あまり2 → 25÷6=4あまり1 → 答え54あまり1"}]}, {"title": "LEVEL 4｜HANA、ここから差がつく♡", "sub": "計算だけじゃない。問題が聞いてることまで見抜こ！", "qs": [{"q": "HANAは480円で同じ値段のキラキラペンを6本買いました。1本はいくら？", "a": "80", "hint": "全部の金額÷本数=1本の値段♡", "exp": "480÷6=80。答え80円。", "tag": "文章題"}, {"q": "225このシールを1ページに18こずつ貼ります。18こ全部貼れるページは何ページ？", "a": "12", "hint": "18×12=216。9こ余るけど、その9こで1ページ作れる？", "exp": "225÷18=12あまり9。18こ全部貼れるのは12ページ！", "tag": "余りを捨てる"}, {"q": "173人がイベントへ行きます。1台40人まで乗れるバスは最低何台必要？", "a": "5", "hint": "173÷40=4あまり13。4台で全員乗れる？", "exp": "4台では13人乗れないので、もう1台。答え5台！", "tag": "余りを+1"}, {"q": "ある数を7で割ると商が12であまりが5。ある数はいくつ？", "a": "89", "hint": "7×12+5！", "exp": "7×12+5=89。逆向きに考えられたらいい感じ♡", "tag": "逆算"}]}, {"title": "LEVEL 5｜HANAのラスボス♡", "sub": "塾で『おっ！』ってなる考えるわり算。いこ〜っ🔥", "qs": [{"q": "同じ数ずつ入った袋が8袋あり、お菓子は全部で192こ。1袋につき3こずつ食べました。残りは全部で何こ？", "a": "168", "hint": "食べた数は全部で3×8こ！", "exp": "3×8=24、192-24=168。1袋分から考えてもOK！", "tag": "2段階"}, {"q": "HANAがカードを9人に7枚ずつ配ると4枚余りました。カードは全部で何枚？", "a": "67", "hint": "9×7に余った4枚を足そう！", "exp": "9×7+4=67。答え67枚♡", "tag": "逆向き"}, {"q": "365本のペンを1箱24本ずつ入れます。全部入れるには最低何箱必要？", "a": "16", "hint": "24×15=360。残り5本にも箱がいるよ！", "exp": "365÷24=15あまり5。だから箱は16箱必要！", "tag": "中受への橋"}, {"q": "ある数を8で割ると商とあまりが同じ数。商が5のとき、ある数はいくつ？", "a": "45", "hint": "商5ならあまりも5。8×5+5！", "exp": "8×5+5=45。HANA、ラスボス撃破〜っ♡", "tag": "FINAL BOSS"}]}];
let step=0,qi=0,answer='',showHint=false,result=null,tries=0,review=false,reviewKey=null;let done={},wrong={};
const all=[];STEPS.forEach((s,si)=>s.qs.forEach((q,i)=>all.push({q,si,qi:i,key:si+'-'+i})));
const cheers=['HANA、正解〜っ♡ いいじゃん！！✨','きたーーっ♡ 大正解！ノってる〜🔥','YES♡ それそれ！最高じゃん✨','正解〜っ♡ 今のめっちゃいい！👏','やったじゃんHANA〜♡ 次もいこっ💖','大正解〜っ♡ いい波きてる✨'];
function norm(v){return String(v).trim().replace(/\s/g,'').replace(/余り|余/g,'あまり').replace(/枚|本|人|円|こ|個|台|箱|ページ/g,'')}
function wrongItems(){return all.filter(x=>wrong[x.key])}function current(){if(review){let a=wrongItems();return a.find(x=>x.key===reviewKey)||a[0]}return {q:STEPS[step].qs[qi],si:step,qi,key:step+'-'+qi}}
function clearAns(){answer='';showHint=false;result=null;tries=0}
function goStep(i){review=false;reviewKey=null;step=i;qi=0;clearAns();render()}
function startReview(){let a=wrongItems();if(!a.length)return;review=true;reviewKey=a[0].key;clearAns();render()}
function check(){let v=document.getElementById('ans').value;if(!v.trim())return;answer=v;let c=current(),ok=norm(v)===norm(c.q.a);result=ok;tries++;if(ok){done[c.key]=true;if(review)delete wrong[c.key]}else wrong[c.key]=true;render()}
function next(){let c=current();clearAns();if(review){let r=wrongItems().filter(x=>x.key!==c.key);if(!r.length){review=false;reviewKey=null}else reviewKey=r[0].key}else if(qi<STEPS[step].qs.length-1)qi++;else if(step<STEPS.length-1){step++;qi=0}render()}
function resetAll(){step=0;qi=0;done={};wrong={};review=false;reviewKey=null;clearAns();render()}
function render(){let c=current();if(!c){review=false;c=current()}let q=c.q,wi=wrongItems(),score=Object.keys(done).length;document.getElementById('bar').style.width=Math.round(score/all.length*100)+'%';document.getElementById('score').textContent='★ '+score+'/'+all.length;document.getElementById('nav').innerHTML=STEPS.map((_,i)=>`<button class="${!review&&i===step?'on':''}" onclick="goStep(${i})">Lv.${i+1}</button>`).join('')+`<button class="review ${review?'on':''}" onclick="startReview()" ${wi.length?'':'disabled'}>🔥復習 ${wi.length}</button>`;let work=c.si===2?`<div class="box work"><b>✍️ HANAの筆算カンペ♡</b><p>たてる → かける → ひく → おろす</p><pre>${escapeHtml(q.work)}</pre><b>式でもチェック♡</b><div>${escapeHtml(q.formula)}</div></div>`:'';let feedback='';if(result===false)feedback=`<div class="box wrong"><b>おっしい〜！🔥 ここ取れたら一気に強くなる♡</b><div>ヒント使って、もう1回いこっ！</div>${tries>=2?`<p><b>答え：${q.a}</b><br>${q.exp}</p>`:''}</div>`;if(result===true)feedback=`<div class="box right"><b>✅ ${review?'リベンジ成功〜っ♡ やったじゃんHANA！！🔥':cheers[(c.si*4+c.qi)%cheers.length]}</b><p><b>答え：${q.a}</b><br>${q.exp}</p><button class="next" onclick="next()">${review?'次のリベンジ♡':'NEXTいこ♡'} →</button></div>`;document.getElementById('app').innerHTML=`<section class="stage"><h2>${review?'🔥 HANAのリベンジTIME♡':STEPS[c.si].title}</h2><div class="sub">${review?'間違えた問題だけ再チャレンジ！正解したら復習リストから卒業♡':STEPS[c.si].sub}</div><div class="question"><div class="meta"><span class="pill">${review?'RETRY':'Q'+(qi+1)+'/'+STEPS[step].qs.length}</span><span class="pill tag"># ${q.tag}</span></div><div class="qtext">${q.q}</div><div class="answer"><input id="ans" value="${escapeHtml(answer)}" placeholder="HANAの答えは？♡" onkeydown="if(event.key==='Enter')check()"><button class="check" onclick="check()">答え合わせ♡</button></div><button class="hintbtn" onclick="showHint=!showHint;render()">💡 ${showHint?'ヒント閉じる':'ヒント、チラ見♡'}</button>${showHint?`<div class="box hint">💡 ${q.hint}</div>`:''}${work}${feedback}</div></section>`;document.getElementById('clear').innerHTML=score===all.length?'<div class="allclear">✨ HANA♡ ALL CLEAR!<br><small>全問クリア〜っ！！割り算、めっちゃ仕上がったじゃん♡</small></div>':''}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}render();
</script></body></html>
