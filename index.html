tn{border:0;margin-top:11px;background:#fffbeb;color:#a16207;border-radius:12px;padding:10px 13px;font-weight:900}.box{margin-top:12px;border-radius:14px;padding:13px;line-height:1.6}.hint{background:#fffbeb}.bad{background:#fff1f2;border:2px solid #fecdd3}.good{background:#ecfdf5;border:2px solid #a7f3d0}.next{background:#172033}.work{background:#f0f9ff;border:2px solid #bae6fd}.work .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.work .steps span{background:white;border-radius:9px;padding:7px;text-align:center;font-size:12px;font-weight:900}.work pre{background:#fff;border-radius:11px;padding:12px;overflow:auto;line-height:1.55}.powers{margin-top:12px}.powersgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.powersgrid div{padding:12px;border-radius:12px;font-size:14px;font-weight:800}.full{margin-top:12px;padding:22px;text-align:center;border-radius:22px;color:#fff;background:linear-gradient(90deg,#ec4899,#9333ea);font-weight:900;font-size:24px}@media(max-width:600px){h1{font-size:28px}.lead{font-size:14px}.card,.stage{padding:15px}.nav{grid-template-columns:repeat(4,1fr)}.qcard{padding:15px}.q{font-size:19px}.answer{display:block}.check,.next{width:100%;margin-top:8px}.work .steps{grid-template-columns:1fr 1fr}.work pre{font-size:12px}.powersgrid{grid-template-columns:1fr}}

const levels=[{"title": "LEVEL 1｜まずは秒でいこ♡", "sub": "暗算10連発！ここはリズムよく、ちゃちゃっと突破♡", "qs": [{"q": "4 ÷ 4 = ?", "a": "1", "hint": "4の中に4は何こ入る？", "exp": "4÷4=1。まずはここから♡", "tag": "秒解き"}, {"q": "5 ÷ 5 = ?", "a": "1", "hint": "同じ数で割ると？", "exp": "5÷5=1！", "tag": "秒解き"}, {"q": "8 ÷ 4 = ?", "a": "2", "hint": "4×□=8！", "exp": "4×2=8だから2。", "tag": "秒解き"}, {"q": "10 ÷ 5 = ?", "a": "2", "hint": "5×□=10！", "exp": "5×2=10だから2。", "tag": "秒解き"}, {"q": "10 ÷ 2 = ?", "a": "5", "hint": "2×□=10！", "exp": "2×5=10だから5。", "tag": "秒解き"}, {"q": "12 ÷ 3 = ?", "a": "4", "hint": "3×□=12！", "exp": "3×4=12だから4。", "tag": "九九で逆算"}, {"q": "18 ÷ 6 = ?", "a": "3", "hint": "6×□=18！", "exp": "6×3=18だから3。", "tag": "九九で逆算"}, {"q": "24 ÷ 4 = ?", "a": "6", "hint": "4×□=24！", "exp": "4×6=24だから6。", "tag": "九九で逆算"}, {"q": "35 ÷ 5 = ?", "a": "7", "hint": "5×□=35！", "exp": "5×7=35だから7。", "tag": "九九で逆算"}, {"q": "56 ÷ 7 = ?", "a": "8", "hint": "7×□=56！", "exp": "7×8=56だから8。10問完走〜っ♡", "tag": "10問FINISH"}]}, {"title": "LEVEL 2｜文章題、読めたら勝ち♡", "sub": "計算はできる！次は『何を割る？』を見抜こ。", "qs": [{"q": "HANAが36このデコパーツを4人で同じ数ずつ分けるよ。1人何こ？", "a": "9", "hint": "全部36こ÷4人♡", "exp": "36÷4=9。『全部÷人数=1人分』だよ。", "tag": "1人分"}, {"q": "42このビーズを1人に6こずつ配るよ。何人に配れる？", "a": "7", "hint": "6このまとまりが42この中にいくつ？", "exp": "42÷6=7。今度は『何人分できる？』のわり算！", "tag": "何人分"}, {"q": "HANAは72枚のシールを8ページに同じ枚数ずつ貼るよ。1ページ何枚？", "a": "9", "hint": "72÷8！", "exp": "72÷8=9。文章があっても式にできれば余裕♡", "tag": "式を作る"}, {"q": "同じ値段のペンを6本買ったら480円。1本はいくら？", "a": "80", "hint": "全部の金額÷本数！", "exp": "480÷6=80。答え80円。", "tag": "ちょいUP"}]}, {"title": "LEVEL 3｜あまり、使いこなそ♡", "sub": "商とあまりをセットで理解。逆算までいったらいい感じ！", "qs": [{"q": "53÷7=?（あまりも。例：7あまり4）", "a": "7あまり4", "hint": "7×7=49。53まであと？", "exp": "53÷7=7あまり4。あまりは割る数より小さく！", "tag": "あまり基本"}, {"q": "68÷9=?（あまりも）", "a": "7あまり5", "hint": "9×7=63。", "exp": "68÷9=7あまり5。9×7+5=68で検算♡", "tag": "検算"}, {"q": "87÷8=?（あまりも）", "a": "10あまり7", "hint": "8×10=80。", "exp": "87÷8=10あまり7。7<8だからOK！", "tag": "ルール"}, {"q": "□÷6=8あまり3。□はいくつ？", "a": "51", "hint": "6×8+3！", "exp": "6×8+3=51。わり算を逆向きに使えた♡", "tag": "逆算"}]}, {"title": "LEVEL 4｜筆算、キレイに攻略♡", "sub": "合言葉は『たてる→かける→ひく→おろす』！", "qs": [{"q": "92÷4=?", "a": "23", "hint": "9の中に4は2回。残り1に2をおろす。", "exp": "92÷4=23。順番どおりなら大丈夫♡", "tag": "筆算基本", "work": "      23\n   ┌────\n 4 │ 92\n     8   ← 4×2\n    ──\n     12  ← 2をおろす\n     12  ← 4×3\n    ──\n      0", "formula": "9÷4=2あまり1 → 12÷4=3 → 答え23"}, {"q": "156÷3=?", "a": "52", "hint": "15÷3=5。そのあと6÷3=2。", "exp": "156÷3=52。3×52=156で検算OK！", "tag": "3けた", "work": "      52\n   ┌─────\n 3 │ 156\n     15  ← 3×5\n     ──\n      06 ← 6をおろす\n       6 ← 3×2\n      ──\n       0", "formula": "15÷3=5 → 6÷3=2 → 答え52"}, {"q": "248÷4=?", "a": "62", "hint": "24÷4=6、そのあと8÷4=2。", "exp": "248÷4=62。大きく見えても同じ♡", "tag": "安定UP", "work": "      62\n   ┌─────\n 4 │ 248\n     24  ← 4×6\n     ──\n      08 ← 8をおろす\n       8 ← 4×2\n      ──\n       0", "formula": "24÷4=6 → 8÷4=2 → 答え62"}, {"q": "325÷6=?（あまりも）", "a": "54あまり1", "hint": "32の中に6は5回。残り2に5をおろす。", "exp": "325÷6=54あまり1。6×54+1=325♡", "tag": "筆算UP", "work": "      54 あまり1\n   ┌─────\n 6 │ 325\n     30  ← 6×5\n     ──\n      25 ← 5をおろす\n      24 ← 6×4\n      ──\n       1 ← あまり", "formula": "32÷6=5あまり2 → 25÷6=4あまり1"}]}, {"title": "LEVEL 5｜HANA、ここから差がつく♡", "sub": "あまりをそのまま？捨てる？＋1？ 問題の意味まで読む！", "qs": [{"q": "225このシールを1ページ18こずつ貼ります。18こ全部貼れるページは何ページ？", "a": "12", "hint": "225÷18=12あまり9。9こで1ページ完成する？", "exp": "答え12ページ。あまりは今回は使わない！", "tag": "余りを捨てる"}, {"q": "173人がイベントへ行きます。1台40人までのバスは最低何台必要？", "a": "5", "hint": "4台は160人まで。残り13人は？", "exp": "もう1台必要なので5台！", "tag": "余りを＋1"}, {"q": "ある数を7で割ると商12、あまり5。ある数はいくつ？", "a": "89", "hint": "7×12+5！", "exp": "7×12+5=89。逆向きに考えられた♡", "tag": "塾モード"}, {"q": "HANAがカードを9人に7枚ずつ配ると4枚余りました。カードは全部で何枚？", "a": "67", "hint": "9×7+4！", "exp": "9×7+4=67。条件を式に戻せたら強い！", "tag": "文章逆算"}]}, {"title": "FINAL｜HANAのラスボスTIME♡", "sub": "最後は『考えるわり算』。ラスボスまで来たHANAならいける🔥", "qs": [{"q": "365本のペンを1箱24本ずつ入れます。全部入れるには最低何箱必要？", "a": "16", "hint": "24×15=360。残り5本にも箱がいる！", "exp": "15箱＋残り用1箱=16箱！", "tag": "BOSS 1"}, {"q": "ある数を8で割ると商とあまりが同じ数。商が5のとき、ある数はいくつ？", "a": "45", "hint": "商5ならあまりも5。8×5+5！", "exp": "8×5+5=45。条件を読む力ナイス♡", "tag": "BOSS 2"}, {"q": "96このビーズを同じ数ずつ8袋に分けました。そのうち3袋分を使いました。使ったビーズは何こ？", "a": "36", "hint": "まず1袋分を出してから3袋分！", "exp": "96÷8=12、12×3=36。2段階で考えられた！", "tag": "BOSS 3"}, {"q": "同じ数ずつ入った袋が8袋あり、お菓子は全部で192こ。そこから1袋につき3こずつ食べました。残りは全部で何こ？", "a": "168", "hint": "食べた数を全部まとめて出す方法もあるよ。3×8は？", "exp": "3×8=24こ食べたので、192-24=168。1袋分を出してから考えてもOK。ラスボス撃破〜っ♡", "tag": "FINAL BOSS"}]}];let li=0,qi=0,input='',hint=false,result=null,tries=0,review=false,reviewKey=null,done={},wrong={};const all=[];levels.forEach((l,a)=>l.qs.forEach((q,b)=>all.push({q,li:a,qi:b,key:a+'-'+b})));const cheers=['きたーーっ♡ HANA正解！いいじゃんっ✨','YES♡ その調子〜！ノってきたじゃん🔥','大正解〜っ♡ 今のめっちゃいい！💖','HANAナイス〜っ♡ その1問デカい👏','ピンポーン♡ いい感じにアガってる〜っ✨'];
function norm(x){return String(x).trim().replace(/\s/g,'').replace(/余り|余/g,'あまり').replace(/枚|本|人|円|こ|個|台|箱|ページ/g,'')}function wrongItems(){return all.filter(x=>wrong[x.key])}function cur(){if(review){let w=wrongItems();return w.find(x=>x.key===reviewKey)||w[0]}return {q:levels[li].qs[qi],li,qi,key:li+'-'+qi}}function clearA(){input='';hint=false;result=null;tries=0}function go(n){review=false;li=n;qi=0;clearA();render()}function rev(){let w=wrongItems();if(!w.length)return;review=true;reviewKey=w[0].key;clearA();render()}function check(){let v=document.getElementById('ans').value;if(!v.trim())return;input=v;let c=cur(),ok=norm(v)===norm(c.q.a);result=ok;tries++;if(ok){done[c.key]=true;if(review)delete wrong[c.key]}else wrong[c.key]=true;render()}function next(){let c=cur();clearA();if(review){let r=wrongItems().filter(x=>x.key!==c.key);if(!r.length){review=false;reviewKey=null}else reviewKey=r[0].key}else if(qi<levels[li].qs.length-1)qi++;else if(li<levels.length-1){li++;qi=0}render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let c=cur();if(!c){review=false;c=cur()}let q=c.q,w=wrongItems(),score=Object.keys(done).length;document.getElementById('bar').style.width=Math.round(score/all.length*100)+'%';document.getElementById('score').textContent='★ '+score+'/'+all.length;document.getElementById('nav').innerHTML=levels.map((_,n)=>`<button class="${!review&&n===li?'on':''}" onclick="go(${n})">${n===5?'FINAL':'Lv.'+(n+1)}</button>`).join('')+`<button class="review ${review?'on':''}" onclick="rev()" ${w.length?'':'disabled'}>🔥復習 ${w.length}</button>`;let work=c.li===3&&q.work?`<div class="box work"><b>✍️ HANAの筆算カンペ♡</b><div class="steps"><span>①たてる</span><span>②かける</span><span>③ひく</span><span>④おろす</span></div><pre>${esc(q.work)}</pre><b>式でもチェック♡</b><div>${esc(q.formula)}</div></div>`:'';let fb='';if(result===false)fb=`<div class="box bad"><b>おっしい〜っ🔥 ここ取ったらまたアガる♡</b><p>ヒント見てもう1回いこ！</p>${tries>=2?`<p><b>答え：${q.a}</b><br>${q.exp}</p>`:''}</div>`;if(result===true)fb=`<div class="box good"><b>✅ ${review?'リベンジ成功〜っ♡ HANAやったじゃん🔥':cheers[(c.li+c.qi)%cheers.length]}</b><p><b>答え：${q.a}</b><br>${q.exp}</p><button class="next" onclick="next()">${review?'次のリベンジ♡':'NEXTいこ♡'} →</button></div>`;document.getElementById('app').innerHTML=`<section class="stage"><h2>${review?'🔥 HANAのリベンジTIME♡':levels[c.li].title}</h2><div class="sub">${review?'間違えた問題だけ倒してこ♡':levels[c.li].sub}</div><div class="qcard"><div class="meta"><span class="pill">${review?'RETRY':'Q'+(qi+1)+'/'+levels[li].qs.length}</span><span class="pill tag"># ${q.tag}</span></div><div class="q">${q.q}</div><div class="answer"><input id="ans" value="${esc(input)}" placeholder="HANAの答えは？♡" onkeydown="if(event.key==='Enter')check()"><button class="check" onclick="check()">答え合わせ♡</button></div><button class="hintbtn" onclick="hint=!hint;render()">💡 ヒント、チラ見♡</button>${hint?`<div class="box hint">💡 ${q.hint}</div>`:''}${work}${fb}</div></section>`;document.getElementById('full').innerHTML=score===all.length?'<div class="full">✨ HANA♡ FULL BOOS </script></body></html>
